name: Issue Completeness

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  analyze:
    name: AI Issue Completeness
    runs-on: ubuntu-latest
    steps:
      - name: Analyze issue with AI
        id: ai-response
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          prompt=$(
            cat <<EOF
            New issue was opened by ${ISSUE_AUTHOR}
            Title: ${ISSUE_TITLE}
            Body:
            ---
            ${ISSUE_BODY}
            ---
            EOF
          )

          response=$(
            jq -n \
              --arg system "You are a GitHub issue assistant. Your task is to analyze newly opened issues for completeness.\n\nProvide concise, helpful suggestions, ask clarifying questions and identify any missing information that would help resolve the issue faster.\n\nAlways respond with ready-to-use markdown content (no code blocks) that can be posted directly as an issue comment.\n\nSign off as AI assistant." \
              --arg prompt "$prompt" \
              '{
                model: "gpt-4o-mini",
                messages: [
                  { role: "system", content: $system },
                  { role: "user", content: $prompt }
                ],
                temperature: 0.7
              }' |
            curl -fsS https://api.openai.com/v1/chat/completions \
              -H "Authorization: Bearer ${OPENAI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d @-
          )

          message=$(echo "$response" | jq -er '.choices[0].message.content')

          {
            echo "response<<EOF"
            echo "$message"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Comment results on the issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: ${{ steps.ai-response.outputs.response }}

            
